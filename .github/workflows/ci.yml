name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentiment_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./code-mixed-sentiment-platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx[http2]

      - name: Run inference unit tests
        working-directory: ./code-mixed-sentiment-platform/backend
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/1
        run: |
          python -m pytest tests/test_inference.py -v --tb=short

      - name: Run API integration tests
        working-directory: ./code-mixed-sentiment-platform/backend
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/1
          MONGODB_URL: ""
        run: |
          python -m pytest tests/test_api.py -v --tb=short -k "not TestMetaAuth"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./code-mixed-sentiment-platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./code-mixed-sentiment-platform/frontend
        run: npm ci

      - name: Run lint
        working-directory: ./code-mixed-sentiment-platform/frontend
        run: npm run lint

      - name: Build
        working-directory: ./code-mixed-sentiment-platform/frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
