services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sentiment_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sentiment_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MONGODB_URL: mongodb://mongo:27017
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      INFERENCE_MODE: ${INFERENCE_MODE:-heuristic}
      # Uncomment when gpu-inference service is running:
      # INFERENCE_URL: ${INFERENCE_URL:-http://gpu-inference:8001/analyze}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sentiment_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MONGODB_URL: mongodb://mongo:27017
      INFERENCE_MODE: ${INFERENCE_MODE:-heuristic}
      # Uncomment when gpu-inference service is running:
      # INFERENCE_URL: ${INFERENCE_URL:-http://gpu-inference:8001/analyze}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Llama 3 GPU Inference Server ──────────────────────────────────────────
  # NEXT SPRINT: Uncomment this entire block to replace the heuristic engine
  # with the fine-tuned Llama 3 8B LoRA model for deeper linguistic accuracy.
  #
  # Prerequisites:
  #   1. Train / download the LoRA adapter: run ai_pipeline/train_lora.py
  #   2. Place adapter weights in ./ai_pipeline/llama3-code-mixed-lora/
  #   3. Set INFERENCE_MODE=llama and INFERENCE_URL=http://gpu-inference:8001/analyze in .env
  #   4. Uncomment the block below and run: docker-compose -f docker-compose.prod.yml up --build gpu-inference
  #
  # gpu-inference:
  #   build:
  #     context: ./ai_pipeline
  #     dockerfile: Dockerfile.gpu          # Create this from the README instructions
  #   command: python inference_server.py --model ./llama3-code-mixed-lora
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   ports:
  #     - "8001:8001"                       # Internal only; not exposed to nginx
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s                  # Allow 2 min for model loading

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  certbot_www:
  certbot_conf:
